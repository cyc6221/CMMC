title: "CMMC"
description: "Study notes on modern cryptography."
remote_theme: pages-themes/hacker@v0.2.0

url: "https://cyc6221.github.io"
baseurl: "/CMMC"

# Author info
author: CY
email: s24343162@gmail.com
github_username: cyc6221
linkedin_url: https://www.linkedin.com/in/ching-yeh-chen-348a513ba/

# Build settings
markdown: kramdown
highlighter: rouge

collections:
  articles:
    output: true
    permalink: /articles/:path/
  papers:
    output: true
    permalink: /research/papers/:path/
  notes:
    output: true
    permalink: /book/notes/:path/

# Overrides Jekyll's default exclude list, so the defaults are repeated here
exclude:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - local-docs
  - resource
  - Gemfile
  - Gemfile.lock
  - vendor

header_pages:
  # - index.md
  - pages/about.md
  - pages/articles.md
  - pages/book.md
  - pages/math.md
  - pages/research.md
  - pages/ctf.md

plugins:
  - jekyll-github-metadata
  - jekyll-sitemap
  - jekyll-remote-theme
  - jekyll-redirect-from

sitemap:
  path: sitemap.xml
